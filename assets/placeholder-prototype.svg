<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Subtle reticle marks -->
  <circle cx="600" cy="300" r="160" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
  <circle cx="600" cy="300" r="220" fill="none" stroke="rgba(232,163,61,0.3)" stroke-width="1"/>
  <line x1="600" y1="100" x2="600" y2="500" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="380" y1="300" x2="820" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Center icon -->
  <g transform="translate(560, 260) scale(1.6)">
    <polygon points="25,5 45,45 5,45" fill="none" stroke="#E8A33D" stroke-width="2.5"/>
    <circle cx="25" cy="32" r="3" fill="#E8A33D"/>
  </g>
  
  <text x="600" y="420" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#F8FAFC" text-anchor="middle">MEDIA PLACEHOLDER</text>
  <text x="600" y="455" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="400" letter-spacing="1" fill="#94A3B8" text-anchor="middle">PROTOTYPE VALIDATION IMAGERY PENDING LAB RECORDING</text>
  <text x="600" y="490" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#E8A33D" text-anchor="middle">PHI LAB &bull; DIMASA</text>
</svg>
